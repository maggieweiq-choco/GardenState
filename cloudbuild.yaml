# Google Cloud Build configuration for deploying to Cloud Run
steps:
  # Step 1: Build the Docker image
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "build"
      - "-t"
      - "gcr.io/$PROJECT_ID/garden-agent:$SHORT_SHA"
      - "-t"
      - "gcr.io/$PROJECT_ID/garden-agent:latest"
      - "."

  # Step 2: Push the image to Container Registry
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "gcr.io/$PROJECT_ID/garden-agent:$SHORT_SHA"

  # Step 3: Deploy to Cloud Run
  - name: "gcr.io/cloud-builders/gke-deploy"
    args:
      - "run"
      - "--filename=."
      - "--image=gcr.io/$PROJECT_ID/garden-agent:$SHORT_SHA"
      - "--location=us-central1"
      - "--output=/workspace/output"

# Alternative simpler Cloud Run deployment (uncomment to use instead of gke-deploy):
# steps:
#   - name: "gcr.io/cloud-builders/docker"
#     args: ["build", "-t", "gcr.io/$PROJECT_ID/garden-agent", "."]
# 
#   - name: "gcr.io/cloud-builders/docker"
#     args: ["push", "gcr.io/$PROJECT_ID/garden-agent"]
# 
#   - name: "gcr.io/cloud-builders/gcloud"
#     args:
#       - "run"
#       - "deploy"
#       - "garden-agent"
#       - "--image=gcr.io/$PROJECT_ID/garden-agent"
#       - "--platform=managed"
#       - "--region=us-central1"
#       - "--allow-unauthenticated"
#       - "--set-env-vars=MDB_MCP_CONNECTION_STRING=${_MDB_CONNECTION_STRING},GOOGLE_API_KEY=${_GOOGLE_API_KEY}"

# Build timeout
timeout: "1800s"

# Images to be pushed to Container Registry
images:
  - "gcr.io/$PROJECT_ID/garden-agent:$SHORT_SHA"
  - "gcr.io/$PROJECT_ID/garden-agent:latest"
